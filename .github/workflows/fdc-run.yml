name: FDC full run
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install viem @openzeppelin/merkle-tree
      - run: node veilmarket-tee/evaluator.js
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
